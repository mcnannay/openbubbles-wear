name: Integration Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/integration-build.yml'
      - 'android/**'
      - 'lib/**'
      - 'tools/**'
      - 'README.md'
      - 'INTEGRATION.md'
      - 'PROTOCOL.md'
      - 'VALIDATION.md'
      - 'STEPS_10_11.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenBubbles + Wear integration
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out Wear companion
        uses: actions/checkout@v4
        with:
          path: wear-companion

      - name: Validate resilience test shell
        shell: bash
        run: bash -n wear-companion/tools/device_resilience_test.sh

      - name: Check out upstream OpenBubbles
        uses: actions/checkout@v4
        with:
          repository: OpenBubbles/openbubbles-app
          ref: rustpush
          path: openbubbles
          submodules: recursive

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: amyu/setup-android@v5

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up fake FairPlay keys
        working-directory: openbubbles
        shell: bash
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            4056631661436364584235346952193
            4056631661436364584235346952194
            4056631661436364584235346952195
            4056631661436364584235346952196
            4056631661436364584235346952197
            4056631661436364584235346952198
            4056631661436364584235346952199
            4056631661436364584235346952200
            4056631661436364584235346952201
            4056631661436364584235346952208
          )
          for name in "${cert_names[@]}"; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem "rustpush/certs/fairplay/$name.pem"
            cp rustpush/certs/legacy-fairplay/fairplay.crt "rustpush/certs/fairplay/$name.crt"
          done

      - name: Apply Wear integration
        run: python3 wear-companion/tools/apply_to_openbubbles.py openbubbles

      - name: Validate patch
        run: |
          git -C openbubbles diff --check
          git -C openbubbles status --short

      - name: Resolve Flutter dependencies
        working-directory: openbubbles
        run: flutter pub get

      - name: Analyze Wear Dart bridge
        working-directory: openbubbles
        run: flutter analyze --no-pub lib/services/wear

      - name: Configure Flutter SDK for Gradle
        shell: bash
        run: |
          cat > openbubbles/android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

      - name: Build Wear APK
        working-directory: openbubbles/android
        shell: bash
        run: |
          set -o pipefail
          gradle :wear:assembleAlphaDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/wear-build.log"

      - name: Upload Wear build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wear-build-log
          path: wear-build.log
          if-no-files-found: ignore

      - name: Build phone APK
        working-directory: openbubbles
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --flavor alpha --debug --target-platform android-arm64 2>&1 | tee "$GITHUB_WORKSPACE/phone-build.log"

      - name: Upload phone build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-build-log
          path: phone-build.log
          if-no-files-found: ignore

      - name: Write build manifest
        shell: bash
        run: |
          {
            echo "wear_companion_sha=$GITHUB_SHA"
            echo "upstream_openbubbles_sha=$(git -C openbubbles rev-parse HEAD)"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            sha256sum \
              openbubbles/build/wear/outputs/apk/alpha/debug/wear-alpha-debug.apk \
              openbubbles/build/app/outputs/flutter-apk/app-alpha-debug.apk
          } > build-manifest.txt

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-build-manifest
          path: build-manifest.txt
          if-no-files-found: error

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-wear-alpha-debug
          path: openbubbles/build/wear/outputs/apk/alpha/debug/wear-alpha-debug.apk
          if-no-files-found: error

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-alpha-debug
          path: openbubbles/build/app/outputs/flutter-apk/app-alpha-debug.apk
          if-no-files-found: error
